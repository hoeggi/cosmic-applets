[workspace]
resolver = "3"
members = ["common", "applets/*"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/hoeggi/cosmic-applets"
authors = ["Daniel Hoeggerl <hoeggerl.daniel@gmail.com>"]

[workspace.dependencies]
cosmic-applet-common = { path = "common" }
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }
chrono = "0.4"
dirs = "6"
notify-rust = "4"
# Secret Service (keyring) client.
oo7 = "0.6"
# Plain HTTP only (LAN services); no TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: headsetcontrol's EQ preset indices follow the JSON key order.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xdgen = "0.1"

[workspace.dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Detached process spawning (cosmic::process::spawn)
    "process",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
