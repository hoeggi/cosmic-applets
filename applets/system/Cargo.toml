[package]
name = "cosmic-applet-system"
version = "0.1.0"
description = "Audio, battery, Bluetooth, network and power in one COSMIC panel applet"
publish = false
edition.workspace = true
# Builds on System76's GPL-3.0 cosmic-applets code, so this crate is GPL, not the workspace's
# MPL-2.0. See docs/LICENSING.md.
license = "GPL-3.0-only"
repository.workspace = true
authors.workspace = true

[build-dependencies]
xdgen.workspace = true

[dependencies]
cosmic-applet-common.workspace = true
# Talks to cosmic-settings-daemon's audio service (MPL-2.0, same revision as upstream's applets).
cosmic-settings-audio-client = { git = "https://github.com/pop-os/cosmic-settings-daemon", rev = "2df041e6e90757782a7884729ae3723e86cee122", features = ["codec"] }
futures-channel = "0.3"
futures-util = "0.3"
i18n-embed.workspace = true
# Upstream's Bluetooth backend (cosmic-applet-bluetooth) is built on these.
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd", "id"] }
fastrand = "2.3"
futures = "0.3"
rustc-hash = "2.1"
# Upstream's audio model (cosmic-applet-audio) uses this.
intmap = "3.1.3"
# Upstream's network model (cosmic-applet-network) is built on these.
indexmap = "2.13"
nmrs = "3.5.7"
secure-string = "0.3"
i18n-embed-fl.workspace = true
libcosmic.workspace = true
rust-embed.workspace = true
# Upstream's power helpers (cosmic-applet-power) use logind through this, at the revision
# cosmic-applets ecb6b61 pins.
cosmic-login1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "6ccc9fbf034220f0142bc907a7d7513b49aba0e1" }
# getuid() for locking this user's sessions.
rustix = { version = "1.1", features = ["process"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
# The zbus libcosmic and upstream's applets use (6.x); D-Bus to logind, UPower, system76-power.
zbus = { version = "6.2", default-features = false, features = ["tokio"] }
# Upstream's battery applet gets the battery and the display brightness from these, at the
# revision cosmic-applets ecb6b61 pins.
cosmic-settings-upower-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "5f43cfc867163f3d9e8d83d79efa959e29d53418" }
cosmic-settings-daemon-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "5f43cfc867163f3d9e8d83d79efa959e29d53418" }

# `cargo deb -p cosmic-applet-system` (see `make deb`)
[package.metadata.deb]
section = "misc"
extended-description = """\
Panel applet for the COSMIC desktop that combines audio, battery, Bluetooth, network and power: \
volume, microphone and brightness sliders, quick tiles for Wi-Fi, Bluetooth, the audio output and \
airplane mode, detail pages for each, and lock, log out, suspend, restart and shut down."""
depends = "$auto"
assets = [
    ["target/release/cosmic-applet-system", "usr/bin/", "755"],
    ["generated/app.desktop", "usr/share/applications/at.hoeggi.CosmicAppletSystem.desktop", "644"],
    ["generated/app.metainfo.xml", "usr/share/metainfo/at.hoeggi.CosmicAppletSystem.metainfo.xml", "644"],
    ["resources/icon.svg", "usr/share/icons/hicolor/scalable/apps/at.hoeggi.CosmicAppletSystem.svg", "644"],
    ["LICENSE", "usr/share/doc/cosmic-applet-system/LICENSE", "644"],
]
