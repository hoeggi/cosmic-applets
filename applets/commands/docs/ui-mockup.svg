<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" xmlns:xlink="http://www.w3.org/1999/xlink" width="1580" height="650" viewBox="0 0 1580 650" font-family="Inter, 'Open Sans', 'Noto Sans', sans-serif">
  <title>COSMIC Commands applet — UI mockup</title>
  <defs>
    <style>
      .t   { fill: #e8e8e8; font-size: 14px; }
      .b   { fill: #e8e8e8; font-size: 14px; font-weight: 600; }
      .s   { fill: #9a9a9a; font-size: 12px; }
      .xs  { fill: #9a9a9a; font-size: 11px; }
      .m   { white-space: pre; fill: #cfcfcf; font-size: 11px; font-family: 'Noto Sans Mono', 'Fira Mono', monospace; }
      .cap { fill: #f2f2f2; font-size: 15px; font-weight: 600; }
      .ok  { fill: #79d18f; }
      .err { fill: #f27979; }
      .acc { fill: #63d0df; }
      .popup { fill: #262626; stroke: #3a3a3a; stroke-width: 1; }
      .panel { fill: #1e1e1e; }
      .div { stroke: #3d3d3d; stroke-width: 1; }
    </style>
    <!-- 16x16 symbolic icons, stroke = currentColor -->
    <symbol id="i-term" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6l2 2-2 2M8 10.5h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-spin" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-ok" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" fill="none" stroke="#1d1d1d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-err" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" fill="none" stroke="#1d1d1d" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z M9 4l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.8 9h6.4l.8-9M6.8 7v4.5M9.2 7v4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 4l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </defs>

  <rect width="1580" height="650" fill="#121618"/>

  <!-- ============ (a) LIST MODE ============ -->
  <g>
    <text x="20" y="30" class="cap">a) List mode — click to run</text>
    <rect x="20" y="46" width="370" height="36" class="panel"/>
    <text x="32" y="69" class="xs">panel</text>
    <rect x="342" y="50" width="40" height="28" rx="14" fill="#3a3a3a"/>
    <use href="#i-term" xlink:href="#i-term" x="354" y="56" width="16" height="16" color="#e8e8e8"/>

    <rect x="20" y="96" width="370" height="418" rx="16" class="popup"/>

    <!-- row: running -->
    <text x="44" y="133" class="t">Backup home</text>
    <text x="340" y="133" class="s" text-anchor="end">running 0:04</text>
    <use href="#i-spin" xlink:href="#i-spin" x="350" y="120" width="16" height="16" color="#63d0df"/>

    <!-- row: success, expanded (hovered) -->
    <rect x="28" y="148" width="354" height="40" rx="8" fill="#353535"/>
    <text x="44" y="173" class="t">Disk usage</text>
    <text x="318" y="173" class="s" text-anchor="end">0.3 s</text>
    <use href="#i-ok" xlink:href="#i-ok" x="326" y="160" width="16" height="16" color="#79d18f"/>
    <use href="#i-chev-d" xlink:href="#i-chev-d" x="350" y="160" width="16" height="16" color="#9a9a9a"/>
    <rect x="36" y="190" width="338" height="72" rx="8" fill="#1a1a1a"/>
    <text x="48" y="207" class="m">Filesystem      Size  Used Avail Use%</text>
    <text x="48" y="223" class="m">/dev/nvme0n1p3  476G  212G  240G  47%</text>
    <text x="48" y="239" class="m">/dev/nvme0n1p1 1022M  254M  769M  25%</text>
    <text x="48" y="255" class="m" fill-opacity=".6">exit 0 · 12:41:07</text>

    <!-- row: success -->
    <text x="44" y="291" class="t">Restart pipewire</text>
    <text x="340" y="291" class="s" text-anchor="end">1.1 s</text>
    <use href="#i-ok" xlink:href="#i-ok" x="350" y="278" width="16" height="16" color="#79d18f"/>

    <!-- row: failure -->
    <text x="44" y="331" class="t">Deploy staging</text>
    <text x="340" y="331" class="s err" text-anchor="end">exit 1</text>
    <use href="#i-err" xlink:href="#i-err" x="350" y="318" width="16" height="16" color="#f27979"/>

    <!-- row: terminal -->
    <text x="44" y="371" class="t">htop</text>
    <text x="340" y="371" class="s" text-anchor="end">in terminal</text>
    <use href="#i-term" xlink:href="#i-term" x="350" y="358" width="16" height="16" color="#9a9a9a"/>

    <line x1="36" y1="394" x2="374" y2="394" class="div"/>
    <use href="#i-chev-r" xlink:href="#i-chev-r" x="40" y="414" width="16" height="16" color="#9a9a9a"/>
    <text x="64" y="427" class="t">Recent runs</text>
    <rect x="340" y="413" width="30" height="18" rx="9" fill="#3a3a3a"/>
    <text x="355" y="426" class="xs" text-anchor="middle" fill="#cfcfcf">12</text>

    <line x1="36" y1="450" x2="374" y2="450" class="div"/>
    <use href="#i-edit" xlink:href="#i-edit" x="40" y="471" width="16" height="16" color="#e8e8e8"/>
    <text x="64" y="484" class="t">Edit commands</text>
  </g>

  <!-- ============ (b) EDIT MODE ============ -->
  <g>
    <text x="410" y="30" class="cap">b) Edit mode</text>
    <rect x="410" y="46" width="370" height="36" class="panel"/>
    <rect x="732" y="50" width="40" height="28" rx="14" fill="#3a3a3a"/>
    <use href="#i-term" xlink:href="#i-term" x="744" y="56" width="16" height="16" color="#e8e8e8"/>

    <rect x="410" y="96" width="370" height="308" rx="16" class="popup"/>
    <text x="434" y="128" class="b">Edit commands</text>

    <g id="edit-rows">
      <!-- names -->
      <text x="434" y="165" class="t">Backup home</text>
      <text x="434" y="205" class="t">Disk usage</text>
      <text x="434" y="245" class="t">Restart pipewire</text>
      <text x="434" y="285" class="t">Deploy staging</text>
      <text x="434" y="325" class="t">htop</text>
    </g>
    <!-- icon button columns: edit 640, up 672, down 704, trash 736 (28px buttons, icon offset 6) -->
    <g color="#cfcfcf">
      <use href="#i-edit" xlink:href="#i-edit" x="646" y="152" width="16" height="16"/>
      <use href="#i-up"   xlink:href="#i-up"   x="678" y="152" width="16" height="16" color="#555"/>
      <use href="#i-down" xlink:href="#i-down" x="710" y="152" width="16" height="16"/>
      <use href="#i-trash" xlink:href="#i-trash" x="742" y="152" width="16" height="16"/>

      <use href="#i-edit" xlink:href="#i-edit" x="646" y="192" width="16" height="16"/>
      <use href="#i-up"   xlink:href="#i-up"   x="678" y="192" width="16" height="16"/>
      <use href="#i-down" xlink:href="#i-down" x="710" y="192" width="16" height="16"/>
      <use href="#i-trash" xlink:href="#i-trash" x="742" y="192" width="16" height="16"/>

      <use href="#i-edit" xlink:href="#i-edit" x="646" y="232" width="16" height="16"/>
      <use href="#i-up"   xlink:href="#i-up"   x="678" y="232" width="16" height="16"/>
      <use href="#i-down" xlink:href="#i-down" x="710" y="232" width="16" height="16"/>
      <use href="#i-trash" xlink:href="#i-trash" x="742" y="232" width="16" height="16"/>

      <use href="#i-edit" xlink:href="#i-edit" x="646" y="272" width="16" height="16"/>
      <use href="#i-up"   xlink:href="#i-up"   x="678" y="272" width="16" height="16"/>
      <use href="#i-down" xlink:href="#i-down" x="710" y="272" width="16" height="16"/>
      <rect x="736" y="266" width="28" height="28" rx="14" fill="#4a2a2a"/>
      <use href="#i-trash" xlink:href="#i-trash" x="742" y="272" width="16" height="16" color="#f27979"/>

      <use href="#i-edit" xlink:href="#i-edit" x="646" y="312" width="16" height="16"/>
      <use href="#i-up"   xlink:href="#i-up"   x="678" y="312" width="16" height="16"/>
      <use href="#i-down" xlink:href="#i-down" x="710" y="312" width="16" height="16" color="#555"/>
      <use href="#i-trash" xlink:href="#i-trash" x="742" y="312" width="16" height="16"/>
    </g>

    <line x1="426" y1="348" x2="764" y2="348" class="div"/>
    <rect x="426" y="358" width="150" height="32" rx="16" fill="#3a3a3a"/>
    <use href="#i-plus" xlink:href="#i-plus" x="442" y="366" width="16" height="16" color="#e8e8e8"/>
    <text x="466" y="379" class="t">Add command</text>
    <rect x="680" y="358" width="84" height="32" rx="16" fill="#63d0df"/>
    <text x="722" y="379" class="t" fill="#10292d" text-anchor="middle" font-weight="600">Done</text>
  </g>

  <!-- ============ (c) FORM ============ -->
  <g>
    <text x="800" y="30" class="cap">c) Add / edit form</text>
    <rect x="800" y="46" width="370" height="36" class="panel"/>
    <rect x="1122" y="50" width="40" height="28" rx="14" fill="#3a3a3a"/>
    <use href="#i-term" xlink:href="#i-term" x="1134" y="56" width="16" height="16" color="#e8e8e8"/>

    <rect x="800" y="96" width="370" height="308" rx="16" class="popup"/>
    <use href="#i-back" xlink:href="#i-back" x="818" y="116" width="16" height="16" color="#e8e8e8"/>
    <text x="842" y="129" class="b">Edit command</text>

    <text x="816" y="160" class="s">Name</text>
    <rect x="816" y="168" width="338" height="36" rx="8" fill="#1d1d1d" stroke="#444"/>
    <text x="828" y="191" class="t">Disk usage</text>

    <text x="816" y="224" class="s">Command</text>
    <rect x="816" y="232" width="338" height="36" rx="8" fill="#1d1d1d" stroke="#63d0df" stroke-width="2"/>
    <text x="828" y="255" class="m" font-size="13">df -h / /boot/efi</text>
    <line x1="944" y1="242" x2="944" y2="259" stroke="#63d0df" stroke-width="1.5"/>
    <text x="816" y="286" class="xs">Runs via sh -c · stdout and stderr are captured</text>

    <text x="816" y="323" class="t">Run in terminal</text>
    <rect x="1114" y="307" width="40" height="22" rx="11" fill="#555"/>
    <circle cx="1125" cy="318" r="8" fill="#dcdcdc"/>

    <line x1="816" y1="348" x2="1154" y2="348" class="div"/>
    <rect x="978" y="358" width="84" height="32" rx="16" fill="#3a3a3a"/>
    <text x="1020" y="379" class="t" text-anchor="middle">Cancel</text>
    <rect x="1070" y="358" width="84" height="32" rx="16" fill="#63d0df"/>
    <text x="1112" y="379" class="t" fill="#10292d" text-anchor="middle" font-weight="600">Save</text>
  </g>

  <!-- ============ (d) PANEL ICON + NOTIFICATIONS + HISTORY ============ -->
  <g>
    <text x="1190" y="30" class="cap">d) Panel icon states &amp; notifications</text>

    <rect x="1190" y="46" width="370" height="36" class="panel"/>
    <text x="1204" y="69" class="s">Idle</text>
    <use href="#i-term" xlink:href="#i-term" x="1524" y="56" width="16" height="16" color="#e8e8e8"/>

    <rect x="1190" y="90" width="370" height="36" class="panel"/>
    <text x="1204" y="113" class="s">Any command running</text>
    <use href="#i-spin" xlink:href="#i-spin" x="1524" y="100" width="16" height="16" color="#63d0df"/>

    <rect x="1190" y="134" width="370" height="36" class="panel"/>
    <text x="1204" y="157" class="s">Last run failed (badge for 5 s)</text>
    <use href="#i-term" xlink:href="#i-term" x="1524" y="144" width="16" height="16" color="#e8e8e8"/>
    <circle cx="1541" cy="146" r="4.5" fill="#f27979" stroke="#1e1e1e" stroke-width="1.5"/>

    <text x="1190" y="204" class="b">Desktop notification</text>
    <text x="1190" y="222" class="xs">only when popup is closed or run took &gt; 2 s</text>

    <rect x="1190" y="234" width="370" height="98" rx="12" fill="#262626" stroke="#3a3a3a"/>
    <use href="#i-term" xlink:href="#i-term" x="1206" y="248" width="16" height="16" color="#9a9a9a"/>
    <text x="1230" y="261" class="xs">Commands · now</text>
    <use href="#i-err" xlink:href="#i-err" x="1206" y="274" width="16" height="16" color="#f27979"/>
    <text x="1230" y="287" class="b">Deploy staging (exit 1)</text>
    <text x="1230" y="306" class="m">ssh: connect to host staging port 22:</text>
    <text x="1230" y="321" class="m">Connection refused</text>

    <rect x="1190" y="342" width="370" height="82" rx="12" fill="#262626" stroke="#3a3a3a"/>
    <use href="#i-term" xlink:href="#i-term" x="1206" y="356" width="16" height="16" color="#9a9a9a"/>
    <text x="1230" y="369" class="xs">Commands · 2 min ago</text>
    <use href="#i-ok" xlink:href="#i-ok" x="1206" y="382" width="16" height="16" color="#79d18f"/>
    <text x="1230" y="395" class="b">Backup home (12.4 s)</text>
    <text x="1230" y="413" class="m">sent 1.21G bytes  speedup is 4.80</text>

    <text x="1190" y="458" class="b">Run history</text>
    <text x="1190" y="476" class="xs">~/.local/state/&lt;APP_ID&gt;/runs.jsonl</text>
    <rect x="1190" y="486" width="370" height="64" rx="8" fill="#1a1a1a"/>
    <text x="1200" y="505" class="m">{"ts":"2026-10-04T12:41:07","name":"Disk</text>
    <text x="1200" y="521" class="m"> usage","exit_code":0,"duration_ms":312,</text>
    <text x="1200" y="537" class="m"> "output":"Filesystem  Size  Used ..."}</text>
  </g>

  <!-- legend -->
  <g transform="translate(20 600)">
    <use href="#i-spin" xlink:href="#i-spin" x="0" y="-12" width="16" height="16" color="#63d0df"/>
    <text x="22" y="1" class="s">running</text>
    <use href="#i-ok" xlink:href="#i-ok" x="90" y="-12" width="16" height="16" color="#79d18f"/>
    <text x="112" y="1" class="s">exit 0 (click to expand output)</text>
    <use href="#i-err" xlink:href="#i-err" x="320" y="-12" width="16" height="16" color="#f27979"/>
    <text x="342" y="1" class="s">non-zero exit</text>
    <use href="#i-term" xlink:href="#i-term" x="450" y="-12" width="16" height="16" color="#9a9a9a"/>
    <text x="472" y="1" class="s">launched in terminal (no capture)</text>
    <text x="1540" y="1" class="xs" text-anchor="end">Mockup only — final look follows the active COSMIC theme</text>
  </g>
</svg>
